<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
  <rect width="900" height="540" fill="#ffffff"/>

  <text x="450" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#1f2328" letter-spacing="-0.3">ternary matvec latency</text>
  <text x="450" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#6e7781">1024 x 1024  |  snapdragon x  |  warmup 20 repeats 9  |  median over runs</text>

  <line x1="80" y1="116" x2="820" y2="116" stroke="#d0d7de" stroke-width="1"/>

  <text x="160" y="158" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#57606a" letter-spacing="0.5">PATH</text>
  <line x1="180" y1="146" x2="180" y2="380" stroke="#d0d7de" stroke-width="1"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#8c959f">
    <text x="200" y="158" text-anchor="middle">0</text>
    <text x="290" y="158" text-anchor="middle">0.5</text>
    <text x="380" y="158" text-anchor="middle">1.0</text>
    <text x="470" y="158" text-anchor="middle">1.5</text>
    <text x="560" y="158" text-anchor="middle">2.0</text>
    <text x="650" y="158" text-anchor="middle">2.5</text>
    <text x="740" y="158" text-anchor="middle">3.0</text>
  </g>

  <g stroke="#d8dee4" stroke-width="0.5" stroke-dasharray="2 4">
    <line x1="200" y1="170" x2="200" y2="370"/>
    <line x1="290" y1="170" x2="290" y2="370"/>
    <line x1="380" y1="170" x2="380" y2="370"/>
    <line x1="470" y1="170" x2="470" y2="370"/>
    <line x1="560" y1="170" x2="560" y2="370"/>
    <line x1="650" y1="170" x2="650" y2="370"/>
    <line x1="740" y1="170" x2="740" y2="370"/>
  </g>

  <g transform="translate(0, 190)">
    <text x="160" y="22" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1f2328">scalar</text>
    <text x="160" y="42" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#6e7781">reference path</text>

    <rect x="200" y="6" width="551" height="56" rx="4" fill="#cf222e" opacity="0.88"/>

    <text x="741" y="32" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.3">3.06 ms</text>
    <text x="741" y="50" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#ffe0de" opacity="0.85">0.69 gop/s</text>
  </g>

  <g transform="translate(0, 280)">
    <text x="160" y="22" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1f2328">arm neon</text>
    <text x="160" y="42" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#6e7781">simd backend</text>

    <rect x="200" y="6" width="97" height="56" rx="4" fill="#1a7f37" opacity="0.95"/>

    <text x="312" y="32" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1f2328" letter-spacing="-0.3">0.54 ms</text>
    <text x="312" y="50" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#656d76">3.92 gop/s</text>
  </g>

  <text x="470" y="395" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#57606a">latency in milliseconds  (lower is better)</text>

  <g transform="translate(180, 425)">
    <rect width="540" height="60" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-opacity="0.35" stroke-width="1"/>
    <rect width="3" height="60" rx="1.5" fill="#1a7f37"/>
    <text x="22" y="26" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#57606a" letter-spacing="0.5">RESULT</text>
    <text x="22" y="48" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1f2328">simd is <tspan font-size="22" font-weight="700" fill="#1a7f37" letter-spacing="-0.3">5.7x</tspan> faster than scalar</text>
    <text x="518" y="38" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#656d76" letter-spacing="0.3">CHECKSUM</text>
    <text x="518" y="52" text-anchor="end" font-family="ui-mono, ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#1a7f37">1.951170 verified</text>
  </g>

  <line x1="80" y1="505" x2="820" y2="505" stroke="#d0d7de" stroke-width="1"/>
  <text x="80" y="525" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#8c959f">arm neon  /  -O3  /  zero dependencies</text>
  <text x="820" y="525" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6e7781" letter-spacing="0.3">github.com/Cintu07/ciot</text>
</svg>
