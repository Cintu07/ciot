<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100">
  <rect width="900" height="1100" fill="#ffffff"/>

  <text x="450" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#1f2328" letter-spacing="-0.3">ciot inference pipeline</text>
  <text x="450" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#6e7781">packed ternary weights stored as .bits files  |  zero heavy dependencies</text>

  <line x1="80" y1="116" x2="820" y2="116" stroke="#d0d7de" stroke-width="1"/>

  <g transform="translate(180, 140)">
    <rect width="540" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <rect width="3" height="56" rx="1.5" fill="#0969da"/>
    <text x="22" y="34" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#57606a" letter-spacing="0.4">01</text>
    <text x="56" y="34" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#1f2328">text input</text>
    <text x="518" y="34" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#8c959f" letter-spacing="0.3">input</text>
  </g>

  <line x1="450" y1="196" x2="450" y2="222" stroke="#afb8c1" stroke-width="1"/>

  <g transform="translate(180, 222)">
    <rect width="540" height="68" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <rect width="3" height="68" rx="1.5" fill="#bc4c00"/>
    <text x="22" y="30" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#57606a" letter-spacing="0.4">02</text>
    <text x="56" y="30" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#1f2328">tokenizer</text>
    <text x="56" y="50" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#656d76">word level lookup table</text>
    <text x="518" y="30" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#8c959f" letter-spacing="0.3">preprocess</text>
  </g>

  <line x1="450" y1="290" x2="450" y2="316" stroke="#afb8c1" stroke-width="1"/>

  <g transform="translate(180, 316)">
    <rect width="540" height="68" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <rect width="3" height="68" rx="1.5" fill="#8250df"/>
    <text x="22" y="30" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#57606a" letter-spacing="0.4">03</text>
    <text x="56" y="30" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#1f2328">embedding</text>
    <text x="56" y="50" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#656d76">vocab by dim ternary weights loaded from .bits</text>
    <text x="518" y="30" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#8c959f" letter-spacing="0.3">weights</text>
  </g>

  <line x1="450" y1="384" x2="450" y2="410" stroke="#afb8c1" stroke-width="1"/>

  <g transform="translate(180, 410)">
    <rect width="540" height="320" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <rect width="3" height="320" rx="1.5" fill="#1a7f37"/>

    <text x="22" y="34" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#57606a" letter-spacing="0.4">04</text>
    <text x="56" y="34" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1f2328">transformer layers</text>
    <text x="56" y="54" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#656d76">repeats N times across the stack</text>
    <text x="518" y="34" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#8c959f" letter-spacing="0.3">compute</text>

