    <g transform="translate(22, 96)">
      <rect width="246" height="204" rx="6" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/>
      <circle cx="18" cy="24" r="3" fill="#1a7f37"/>
      <text x="30" y="28" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1f2328">attention block</text>
      <line x1="16" y1="42" x2="230" y2="42" stroke="#d8dee4" stroke-width="1"/>

      <text x="16" y="64" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#424a53">rmsnorm</text>
      <text x="16" y="86" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#424a53">q k v projection</text>
      <text x="16" y="108" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#424a53">rope rotation</text>
      <text x="16" y="130" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#424a53">multi head attention</text>
      <text x="16" y="152" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#424a53">kv cache append</text>
      <text x="16" y="174" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#424a53">output projection</text>
      <text x="16" y="196" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#424a53">residual add</text>
    </g>

    <g transform="translate(272, 96)">
      <rect width="246" height="204" rx="6" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/>
      <circle cx="18" cy="24" r="3" fill="#1a7f37"/>
      <text x="30" y="28" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1f2328">feedforward block</text>
      <line x1="16" y1="42" x2="230" y2="42" stroke="#d8dee4" stroke-width="1"/>

      <text x="16" y="64" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#424a53">rmsnorm</text>
      <text x="16" y="86" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#424a53">feedforward (relu)</text>
      <text x="16" y="108" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#424a53">residual add</text>

      <line x1="16" y1="148" x2="230" y2="148" stroke="#d8dee4" stroke-width="1"/>
      <text x="16" y="170" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#57606a">weights stored as</text>
      <text x="16" y="186" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#57606a">packed ternary .bits</text>
    </g>
  </g>

  <line x1="450" y1="730" x2="450" y2="756" stroke="#afb8c1" stroke-width="1"/>

  <g transform="translate(180, 756)">
