    <rect width="3" height="68" rx="1.5" fill="#8250df"/>
    <text x="22" y="30" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#57606a" letter-spacing="0.4">05</text>
    <text x="56" y="30" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#1f2328">lm head</text>
    <text x="56" y="50" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#656d76">project hidden states to vocab logits</text>
    <text x="518" y="30" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#8c959f" letter-spacing="0.3">weights</text>
  </g>

  <line x1="450" y1="824" x2="450" y2="850" stroke="#afb8c1" stroke-width="1"/>

  <g transform="translate(180, 850)">
    <rect width="540" height="68" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <rect width="3" height="68" rx="1.5" fill="#bc4c00"/>
    <text x="22" y="30" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#57606a" letter-spacing="0.4">06</text>
    <text x="56" y="30" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#1f2328">token decode</text>
    <text x="56" y="50" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#656d76">argmax selection over vocab</text>
    <text x="518" y="30" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#8c959f" letter-spacing="0.3">postprocess</text>
  </g>

  <line x1="450" y1="918" x2="450" y2="944" stroke="#afb8c1" stroke-width="1"/>

  <g transform="translate(180, 944)">
    <rect width="540" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <rect width="3" height="56" rx="1.5" fill="#0969da"/>
    <text x="22" y="34" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#57606a" letter-spacing="0.4">07</text>
    <text x="56" y="34" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#1f2328">text output</text>
    <text x="518" y="34" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#8c959f" letter-spacing="0.3">output</text>
  </g>

  <line x1="80" y1="1040" x2="820" y2="1040" stroke="#d0d7de" stroke-width="1"/>
  <text x="80" y="1064" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6e7781" letter-spacing="0.3">simd backends</text>
  <text x="80" y="1080" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#8c959f">arm neon  /  avx2  /  avx 512  /  scalar reference path included</text>

  <text x="820" y="1064" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6e7781" letter-spacing="0.3">github.com/Cintu07/ciot</text>
  <text x="820" y="1080" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#8c959f">2026 05 24</text>
